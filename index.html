  async function importData(raw,{mode='merge',synced=false}={}){
    need('backup.manage');if(mode==='replace')needAdmin();
    if(mode==='replace'&&synced)return restoreSynced(raw);
    const data=validateBackup(raw);
    const kc=data.stores.settings?.find(x=>x.key==='keycheck')?.value;
    if(mode==='merge'&&kc&&!(await keyOk(kc)))throw new DataError('النسخة مشفّرة بمفتاح مختلف؛ استخدم الاستبدال الكامل');
    if(mode==='replace')await backupNow({kind:'pre-restore'});
    const names=DB_STORES.filter(n=>n!=='backups'&&n!=='syncQueue');
    const keepMedia=new Map();
    if(mode==='replace')for(const m of await getAllRaw('media'))if(m.blob instanceof Blob)keepMedia.set(m.id,m.blob);
    for(const r of data.stores.media||[]){if(typeof r.data==='string'){r.blob=new Blob([b64u.dec(r.data)],{type:clean(r.mime,80)||'application/octet-stream'});delete r.data;delete r.mime}}
    const device={node:await getSetting('node'),hlc:await getSetting('hlc')};
    let total=0,maxH='';
    await T([...names,'syncQueue'],'readwrite',async(tx,os)=>{
      if(mode==='replace')for(const n of names)os(n).clear();
      for(const n of names){
        const arr=data.stores[n];if(!arr)continue;const kp=kpOf(n);
        for(const r of arr){
          if(n==='settings'&&DEVICE_KEYS.has(r.key))continue;
          if(r._hlc&&r._hlc>maxH)maxH=r._hlc;
          if(n==='media'&&!r.blob){const cur=keepMedia.get(r.id)||(mode==='merge'?(await idbReq(os('media').get(r.id)))?.blob:null);if(cur)r.blob=cur}
          if(mode==='replace'){os(n).put(r);total++;continue}
          if(n==='audit'){const{seq:_q,...rest}=r;if(!(await idbReq(os('audit').index('at').count(r.at)))){os('audit').add(rest);total++}continue}
          const cur=await idbReq(os(n).get(r[kp]));
          const newer=n==='trash'?!cur||(r.deletedAt||0)>(cur.deletedAt||0):!cur||String(r._hlc||'')>String(cur._hlc||'');
          if(newer){os(n).put(r);total++;if(RESTORE_SET.has(n)&&r._hlc)os('syncQueue').add({store:n,id:r[kp],op:'put',hlc:r._hlc})}
        }
      }
      if(mode==='replace'){os('settings').put({key:'node',value:device.node});os('settings').put({key:'hlc',value:device.hlc||''})}
    });
    if(maxH)clock.recv(maxH);
    await putSettingSys('hlc',clock.last);
    await logEvent('import',{mode,count:total});
    bump(names);
    const kc2=await getSetting('keycheck');const me=sess?await getRaw('users',sess.user.id):null;
    if((kc2&&!(await keyOk(kc2)))||!me||!me.active){await logout();return{total,relogin:true}}
    return{total,relogin:false};
  }

const fmtDate=ts=>{try{return new Intl.DateTimeFormat('ar-PS-u-nu-latn',{day:'numeric',month:'short',year:'numeric',hour:'numeric',minute:'2-digit'}).format(new Date(ts))}catch{return new Date(ts).toLocaleString()}};
const fmtSize=b=>b<1024?`${b} B`:b<1048576?`${(b/1024).toFixed(1)} KB`:`${(b/1048576).toFixed(1)} MB`;
const daysLabel=n=>n===0?'اليوم':n===1?'يوم واحد':n===2?'يومان':n<=10?`${n} أيام`:`${n} يوماً`;
const auditVal=(f,v)=>{if(v==null||v==='')return '';if(f==='role')return ROLE_LABEL[v]||v;if(f==='active')return v===1||v==='1'||v===true?'نعم':'لا';if(f==='status')return SP_STATUS[v]?.[0]||optLabel('status',v);if(f==='size')return fmtSize(Number(v)||0);const map={kind:{auto:'تلقائية',manual:'يدوية','pre-restore':'قبل الاستعادة'},mode:{merge:'دمج',replace:'استبدال كامل'},reason:{idle:'خمول',manual:'يدوي',version:'تحديث القاعدة'}}[f];return map?.[v]||String(v)};
function auditItem(a){
  const k=auditKindOf(a.action);
  const what=`${ACTION_LABEL[a.action]||a.action}${a.entity&&!['session','system'].includes(a.entity)?` · ${STORE_LABEL[a.entity]||a.entity}`:''}`;
  return html`<details class="au" data-k="${k}"><summary><span class="dot" aria-hidden="true"></span><span class="r-t"><span>${what}${a.title?html` — <b>${a.title}</b>`:''}</span><small>${a.userName||''} · ${relTime(a.ts)}</small></span></summary>
  ${a.changes?.length?html`<div class="ch">${a.changes.map(c=>html`<div><b>${FIELD_LABEL[c.f]||c.f}</b><span>${c.o!=null&&c.o!==''?html`<del>${auditVal(c.f,c.o)}</del> ← `:''}<ins>${c.n!=null&&c.n!==''?auditVal(c.f,c.n):'—'}</ins></span></div>`)}${a.reason?html`<div><b>السبب</b><span>${a.reason}</span></div>`:''}</div>`:html`<div class="ch"><div><b>الوقت</b><span class="num">${fmtDate(a.ts)}</span></div></div>`}</details>`;
}

function optKey(field,v){

}

function translitFirst(nameAr,nameEn){
  const en=String(nameEn||'').trim().split(/\s+/)[0].toLowerCase().replace(/[^a-z]/g,'');
  if(en.length>=2)return en.slice(0,20);
  const parts=clean(nameAr).replace(/^(الطفله|الطفلة|الطفل)\s+/,'').split(/\s+/);
  let first=parts[0]||'';if(/^(عبد|ابو|أبو)$/.test(first)&&parts[1])first+=parts[1];
  const key=normalizeAr(first).replace(/\s/g,'');if(NAME_LAT[key])return NAME_LAT[key];
  let out='';for(const ch of first)out+=AR_LAT[ch]??(/[a-z0-9]/i.test(ch)?ch.toLowerCase():'');

  return out.length>=2?out:'';
}

function createFinance(r){
  let fx=[],curs=[],base='ILS',fee=9,loaded=false;
  async function refresh(){
    const[c,f,b,fe]=await Promise.all([r.list('currencies',{pii:'none'}),r.list('fxRates',{pii:'none'}),r.publicSetting('finance.baseCurrency').catch(()=>null),r.publicSetting('finance.transferFeeILS').catch(()=>null)]);
    curs=c.filter(x=>x.active!==0).sort((a,b)=>(a.order||99)-(b.order||99)||String(a.code).localeCompare(b.code));
    curCache=new Map([...CUR_SEED.map(x=>[x.code,x]),...c.map(x=>[x.code,{...(CUR_SEED.find(s=>s.code===x.code)||{}),...x}])]);
    fx=f.filter(x=>Number(x.rate)>0&&/^[A-Z]{3}\/[A-Z]{3}$/.test(x.pair||'')).sort((a,b)=>String(b.date).localeCompare(String(a.date))||String(b._hlc).localeCompare(String(a._hlc)));
    base=/^[A-Z]{3}$/.test(b||'')?b:'ILS';fee=Number(fe??9);if(!Number.isFinite(fee)||fee<0)fee=0;loaded=true;
    return{curs,fx,base,fee};
  }
  const ready=()=>loaded?null:refresh();
  // أحدث سعر مؤرخ حتى التاريخ المطلوب، مباشر أو معكوس
  function rateFor(code,date=localDate()){
    if(!code)return null;if(code===base)return{rate:1,date,id:''};
    for(const x of fx){if(x.date>date)continue;if(x.pair===`${code}/${base}`)return{rate:Number(x.rate),date:x.date,id:x.id};if(x.pair===`${base}/${code}`)return{rate:round2(1/Number(x.rate)*1e4)/1e4,date:x.date,id:x.id}}
    return null;
  }
  function convert(s){
    const amt=Number(s?.amount);if(!Number.isFinite(amt))return null;
    const date=s.receivedDate||(s.month?monthEnd(s.month):s.date)||localDate();
    let rt=null;
    if(s.currency===base)rt={rate:1,date};
    else if(s.base===base&&Number(s.rate)>0)rt={rate:Number(s.rate),date:s.rateDate||date};
    else rt=rateFor(s.currency,date);
    if(!rt)return{rated:false,amount:amt,currency:s.currency,date};
    const value=round2(amt*rt.rate),f=Math.max(0,Number(s.fee)||0);
    return{rated:true,amount:amt,currency:s.currency,value,rate:rt.rate,rateDate:rt.date,fee:f,net:round2(Math.max(0,value-f)),date};
  }
  function totals(recs){

  }
  const latestBy=(recs,key)=>{const m=new Map();for(const s of recs){const k=key(s),p=m.get(k);if(!p||s.rev>p.rev)m.set(k,s)}return m};
  async function monthRecords(month){return latestBy(await r.list('sponsorships',{index:'month',query:month,pii:'none'}),s=>s.orphanId)}
  async function history(orphanId,month){return (await r.list('sponsorships',{index:'orphanMonth',query:[orphanId,month],pii:'none'})).sort((a,b)=>b.rev-a.rev)}

  const activeIn=(l,m)=>!!l.active&&(!l.startMonth||l.startMonth<=m)&&(!l.endMonth||l.endMonth>=m);
  async function defaultsFor(o,month){

async function docOut(mode,pages,{wMm,hMm,name,title}){
  if(mode==='print')return printPages(pages,wMm,hMm);
  const blob=await Pdf.fromCanvases(pages,{title,wMm,hMm});
  if(mode==='share'){const f=new File([blob],name,{type:'application/pdf'});if(navigator.canShare?.({files:[f]})){await navigator.share({files:[f],title});return}}
  if(!download(name,blob,'application/pdf'))throw new DataError('تعذّر تنزيل الملف');
  toast('تم تجهيز ملف PDF','ok');
}
function printPages(pages,wMm,hMm){
  const box=$('#print-doc');box.replaceChildren(...pages.map(c=>Object.assign(document.createElement('img'),{src:c.toDataURL('image/jpeg',.94),alt:''})));
  let st=$('#print-page');if(!st){st=document.createElement('style');st.id='print-page';document.head.append(st)}
  st.textContent=`@page{size:${wMm}mm ${hMm}mm;margin:0}`;
  document.body.classList.add('printing');
  const done=()=>{document.body.classList.remove('printing');box.replaceChildren();removeEventListener('afterprint',done)};
  addEventListener('afterprint',done);
  setTimeout(()=>{try{print()}catch{done()}},80);
}

        <div class="b-h"><input type="checkbox" class="pick" data-pk${sel.has(r.o.id)?raw(' checked'):''} aria-label="تحديد ${r.o.nameAr}">${portraitRing(r.o,40,{pct:false})}<span class="r-t"><b>${r.o.nameAr}</b><small><span class="num">OR${r.o.code}</span> · ${r.donorName||'بلا متبرع'} · ${r.src==='link'?'رابط كفالة':r.src==='implicit'?'من ملف اليتيم':'سجل سابق'}</small></span>${r.rec?html`<span class="chip ${SP_STATUS[spStatus(r.rec.status)]?.[1]||''}">${SP_STATUS[r.rec.status]?.[0]||''} · <span class="num">${r.rec.rev}</span></span>`:''}</div>

      if(!(await Dlg.confirm({title:`حفظ ${items.length} سجل؟`,text:`يُضاف لكل يتيم سجل ${monthName(m)} أو مراجعة جديدة إن تغيّر؛ الصفوف غير المتغيرة تُتجاوز.`,ok:'حفظ'})))return;
      sv.classList.add('busy');sv.disabled=true;const lb=sv.querySelector('span');
      try{const res=await Finance.saveBatch(items,m,(n,tot)=>{lb.textContent=`${n}/${tot}`});toast(`حُفظ ${res.done} · تُجوّز ${res.skipped}${res.errs.length?` · أخطاء ${res.errs.length}`:''}`,res.errs.length?'warn':'ok',5000);if(res.errs.length)Dlg.open({title:'صفوف لم تُحفظ',body:html`<div class="list">${res.errs.map(x=>html`<div class="row"><span class="r-ic">${icon('alert')}</span><span class="r-t"><b class="num">OR${x.code}</b><small>${x.msg}</small></span></div>`)}</div>`})}

  async function paintFx(){
    const t=++tk;panel.replaceChildren(toFrag(skelList(3)));panel.oninput=panel.onclick=panel.onchange=null;
    try{await Finance.refresh()}catch(e){return fail(e)}
    if(t!==tk)return;

        ${canW?html`<div class="form-grid" style="grid-column:1/-1">${selectH('fxbase','العملة الأساسية',Finance.curs.map(c=>[c.code,`${c.code} · ${c.name}`]),B)}<div class="field"><input id="fee-${fid}" data-fee inputmode="decimal" dir="ltr" placeholder=" " value="${Finance.fee}" maxlength="8" autocomplete="off"><label for="fee-${fid}">عمولة التحويل الافتراضية (${curSym(B)})</label></div></div>`:''}</div>

function matchDonorByName(name,donors){
  const n=normalizeAr(clean(name,80));if(!n)return{id:''};
  let d=donors.find(x=>normalizeAr(x.name)===n);
  if(!d)d=donors.find(x=>normalizeAr(x.name).includes(n)||n.includes(normalizeAr(x.name)));
  return d?{id:d.id}:{id:'',warn:`لم يُعثر على متبرع باسم «${name}»`};
}
function matchAidType(name,types){
  const n=normalizeAr(clean(name,60));if(!n)return null;
  return types.find(x=>normalizeAr(x.name)===n)||types.find(x=>normalizeAr(x.name).includes(n)||n.includes(normalizeAr(x.name)))||null;
}
function matchByLabel(opts,cellVal){
  const raw=clean(cellVal,60),n=normalizeAr(raw);if(!n)return'';
  const hit=opts.find(([k,l])=>k===raw||normalizeAr(String(l))===n||normalizeAr(k)===n);
  return hit?hit[0]:'';
}
// محرك عام: قالب Excel بالكود -> معاينة (جاهز/خطأ) -> حفظ بالإبقاء على الصفوف الصحيحة -> تقرير أخطاء قابل للتنزيل
function codeImportDlg(cfg){

    ${errH()}</div>`;

      <div class="sum-grid"><div><small>جاهز</small><b class="num" style="color:var(--ok)">${c('ready')}</b></div><div><small>أخطاء</small><b class="num" style="color:var(--danger)">${c('error')}</b></div><div><small>الإجمالي</small><b class="num">${plan.length}</b></div></div>
      <div class="pv-wrap"><table class="pv"><thead><tr><th>#</th><th>الحالة</th><th>الكود</th><th>الاسم</th><th>ملاحظة</th></tr></thead><tbody>${plan.slice(0,300).map(x=>html`<tr data-s="${x.status}"><td class="num">${x.row}</td><td>${x.status==='ready'?'جاهز':'خطأ'}</td><td class="num">${x.code||'—'}</td><td>${x.name||'—'}</td><td>${x.msg||x.warn||''}</td></tr>`)}</tbody></table></div>
      ${plan.length>300?html`<p class="muted">تُعرض أول 300 صف من <span class="num">${plan.length}</span>.</p>`:''}

  };
  const repaint=b=>$('[data-body]',b).replaceChildren(toFrag(build()));
  Dlg.open({title:cfg.title,body:html`<div data-body>${build()}</div>`,onMount(b){
    const onFile=async file=>{

        const sheets=await readTable(file);if(!sheets.length)throw new DataError('الملف لا يحوي بيانات');
        sheet=sheets[0];ctx=ctx||await cfg.buildCtx();
        const rows=sheet.rows,head=rows[0]||[],idx=headIdx(head),body=rows.slice(1).filter(r=>r.some(v=>v!==''&&v!=null));
        plan=body.map((r,i)=>({row:i+2,...cfg.parseRow(cellsOf(r,idx),ctx)}));
        repaint(b);
      }catch(err){sheet=null;plan=null;repaint(b);const e_=$('[data-err]',b);if(e_)e_.textContent=err.message}
    };
    b.addEventListener('change',e=>{if(e.target.matches('[data-ifile]')){const f=e.target.files?.[0];e.target.value='';if(f)onFile(f)}});
    b.addEventListener('dragover',e=>{const d=e.target.closest('[data-drop]');if(d){e.preventDefault();d.classList.add('over')}});
    b.addEventListener('dragleave',e=>e.target.closest('[data-drop]')?.classList.remove('over'));
    b.addEventListener('drop',e=>{const d=e.target.closest('[data-drop]');if(!d)return;e.preventDefault();d.classList.remove('over');const f=e.dataTransfer?.files?.[0];if(f)onFile(f)});

        onMount(eb){eb.addEventListener('click',e2=>{if(e2.target.closest('[data-dl-errs]'))download(`import-errors-${localDate()}.xlsx`,Xlsx.write([{name:'الأخطاء',rows:[['الصف','الكود','الخطأ'],...allErrs.map(x=>[String(x.row),x.code||'',x.msg])],widths:[8,12,60]}]),'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet')})}});
      else Dlg.close();
    });
  }});
}

async function applySelfSub(sub,ts){
  if(!repo.can('orphans.write')||!sub?.id||!sub.o)return 0;
  const id=sub.id,o=await repo.get('orphans',id,{pii:'none'}).catch(()=>null);if(!o)return 0;
  const h=String(sub._hlc||''),fin=repo.can('finance.write'),main=h>String(o.selfHlc||''),wal=fin&&h>String(o.selfWHlc||'');
  if(!main&&!wal)return 0;
  const at=Date.parse(ts||'')||Date.now();
  if(o.selfLock&&!(Number(o.selfUntil)>=at))return 0;
  repo.recv(h);
  const O=sub.o,v={},dirty=new Set(),open=async(tok,aad)=>tok?repo.openSelf(tok,aad):'';
  if(main){
    for(const f of SELF_FIELDS)if(f in O&&!['walletType','provider','holderName'].includes(f))v[f]=O[f];
    if(O.thumb)v.thumb=O.thumb;
    for(const f of ['nid','motherNid']){const p=await open(O[f+'Enc'],`orphans|${f}|${id}`);if(p){v[f]=p;dirty.add(f)}}
    const g=await open(sub.s?.guardianNid,`self|guardianNid|${id}`);if(g){v.guardianNid=g;dirty.add('guardianNid')}
  }
  if(wal){for(const f of ['walletType','provider','holderName'])if(f in O)v[f]=O[f];const a=await open(sub.s?.accountNumber,`self|accountNumber|${id}`);if(a){v.accountNumber=a;dirty.add('accountNumber')}}
  await Orphans.save(v,{id,dirty,reason:'تحديث من اليتيم'});
  const lock=sub.confirm&&main&&!(o.selfLock&&Number(o.selfAt)>=Number(sub.at));
  await repo.save('orphans',{id,...(main?{selfHlc:h}:{}),...(wal?{selfWHlc:h}:{}),...(lock?{selfLock:1,selfAt:Number(sub.at)||Date.now(),selfUntil:0}:{})},{reason:'تحديث من اليتيم'});
  return 1;
}

const RegBox={
  async seal(pub,aad){
    const peer=await crypto.subtle.importKey('jwk',{kty:'EC',crv:'P-256',x:pub.x,y:pub.y,ext:true},{name:'ECDH',namedCurve:'P-256'},false,[]);
    const eph=await crypto.subtle.generateKey({name:'ECDH',namedCurve:'P-256'},true,['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'ECDH',public:peer},eph.privateKey,{name:'AES-GCM',length:256},false,['encrypt']);
    const e=await crypto.subtle.exportKey('jwk',eph.publicKey);
    return{e:{x:e.x,y:e.y},async enc(bytes,tag){const iv=Sec.rand(12),ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv,additionalData:te.encode(aad+'|'+tag)},key,bytes)),o=new Uint8Array(12+ct.length);o.set(iv);o.set(ct,12);return o}};
  },
  async open(priv,env,aad){

    const key=await crypto.subtle.deriveKey({name:'ECDH',public:peer},priv,{name:'AES-GCM',length:256},false,['decrypt']);
    return async(bytes,tag)=>new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes.subarray(0,12),additionalData:te.encode(aad+'|'+tag)},key,bytes.subarray(12)));
  }

  function show(v,data){

/* ══════════ ٤٥ محرك الوحدات: حقول نموذج من schema ══════════ */
// تغطي فقط نموذج الإضافة/التعديل (لا القوائم ولا التفصيل)؛ القوائم وتقارير PDF/Excel وخصائص كل وحدة الخاصة تبقى كما هي عبر extra
const FieldKinds={
  text:{h:(f,v)=>fieldH({name:f.name,label:f.label,value:v??'',max:f.max||80,req:f.req!==false,dir:f.dir||'',mode:f.mode||'',wide:!!f.wide}),
    parse:(fd,f)=>{const v=clean(fd.get(f.name),f.max||80);if(f.req!==false&&!v)throw new DataError(f.err||`أدخل ${f.label}`);return v}},
  tel:{h:(f,v)=>fieldH({name:f.name,label:f.label,value:v?fmtPhone(v):'',dir:'ltr',mode:'tel',max:f.max||20,req:f.req!==false}),
    parse:(fd,f)=>{const v=normPhone(fd.get(f.name));if(f.req!==false&&!v)throw new DataError(f.err||`أدخل ${f.label}`);return v||''}},
  email:{h:(f,v)=>fieldH({name:f.name,label:f.label,type:'email',value:v??'',dir:'ltr',max:f.max||80,req:f.req!==false}),
    parse:(fd,f)=>{const v=clean(fd.get(f.name),f.max||80);if(v&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v))throw new DataError('البريد الإلكتروني غير صالح');if(f.req!==false&&!v)throw new DataError(f.err||`أدخل ${f.label}`);return v}},
  money:{h:(f,v)=>fieldH({name:f.name,label:f.label,value:v??'',dir:'ltr',mode:'decimal',max:f.max||10,req:f.req!==false}),
    parse:(fd,f)=>{const n=numIn(fd.get(f.name));if(n==null){if(f.req!==false)throw new DataError(f.err||`أدخل ${f.label}`);return null}if(f.gt0&&n<=0)throw new DataError(f.err||`أدخل ${f.label}`);if(!f.noRange&&(n<(f.min??0)||n>(f.maxVal??1e7)))throw new DataError(f.err||`${f.label} خارج النطاق`);return n}},
  number:{h:(f,v)=>fieldH({name:f.name,label:f.label,value:v??'',dir:'ltr',mode:'numeric',max:f.max||7,req:f.req!==false}),
    parse:(fd,f)=>{const n=numIn(fd.get(f.name));if(n==null){if(f.req!==false)throw new DataError(f.err||`أدخل ${f.label}`);return null}return clamp(Math.round(n),f.min??0,f.maxVal??99)}},
  date:{h:(f,v)=>dateH(f.name,f.label,v||(f.today?localDate():''),f.dtype||'date'),
    parse:(fd,f)=>{const v=parseDateAny(fd.get(f.name)).iso;if(!v){if(f.req!==false)throw new DataError(f.err||`حدّد ${f.label}`);return ''}if(f.noFuture&&v>localDate())throw new DataError('التاريخ في المستقبل');return v}},
  select:{h:(f,v)=>selectH(f.name,f.label,typeof f.options==='function'?f.options():f.options,v),
    parse:(fd,f)=>{const opts=typeof f.options==='function'?f.options():f.options;const v=String(fd.get(f.name)||'');return opts.some(o=>o[0]===v)?v:(f.default??opts[0]?.[0]??'')}},
  textarea:{h:(f,v)=>noteH(f.name,f.label,v||'',!!f.wide),
    parse:(fd,f)=>clean(fd.get(f.name),f.max||400)},
  checkbox:{h:(f,v)=>html`<label class="check"><input type="checkbox" name="${f.name}"${v?raw(' checked'):''}><span>${f.label}</span></label>`,
    parse:(fd,f)=>fd.get(f.name)==='on'}
};
function renderOneField(f,record,extra){
  if(f.kind==='slot')return extra?.slots?.[f.name]?.(record)||'';
  const val=record?(f.get?f.get(record):(record[f.name]??f.default??'')):(f.default!==undefined?f.default:'');
  return FieldKinds[f.kind].h(f,val);
}

  const listH=html`<div class="list${cfg.virtual?' o-list':''}${cfg.sec||cfg.embed?'':' rise'}"${cfg.sec||cfg.embed?'':raw(' style="--i:2"')} data-bind="list">${skelList(cfg.skel||5)}</div>${cfg.virtual?'':html`<div data-sentinel style="height:1px"></div>`}`;

  const rowNode=(o,i)=>{const n=toFrag(cfg.row(o,ctx)).firstElementChild;if(i!=null){n.dataset.i=i;n.style.top=i*RH+'px'}return n};

  return el;
}

async function readBeneficiaries(file){
  if(file.size>20*1048576)throw new DataError('الملف أكبر من 20MB');
  const sh=(await readTable(file))[0];if(!sh)throw new DataError('الملف لا يحوي بيانات');
  const rows=sh.rows.filter(r=>r.some(c=>c!==''&&c!=null));let hi=0,best=-1;
  rows.slice(0,10).forEach((r,i)=>{const n=r.filter(c=>typeof c==='string'&&c.trim()&&!/^[\d\s\-+/.]+$/.test(c.trim())).length;if(n>best){best=n;hi=i}});
  const head=(rows[hi]||[]).slice(0,10).map((h,i)=>clean(h,40)||`عمود ${i+1}`),body=rows.slice(hi+1).map(r=>head.map((_,i)=>{const v=r[i];return v==null?'':typeof v==='number'?v:clean(v,80)}));
  const keep=[];let size=0;for(const r of body){size+=JSON.stringify(r).length;if(size>600000)break;keep.push(r)}
  return{head,rows:keep,count:body.length,file:clean(file.name,80),at:Date.now()};
}

async function sealImage(file,clear=true){
  if(!/^image\//.test(file?.type||''))throw new DataError('الملف ليس صورة');
  const d=await decodeImage(file),k=Math.min(1,520/Math.max(d.w,d.h)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(d.w*k));c.height=Math.max(1,Math.round(d.h*k));
  const x=c.getContext('2d',{willReadFrequently:true});x.imageSmoothingQuality='high';x.drawImage(d.img,0,0,c.width,c.height);d.close();
  if(clear){const im=x.getImageData(0,0,c.width,c.height),p=im.data;for(let i=0;i<p.length;i+=4){const l=(p[i]*299+p[i+1]*587+p[i+2]*114)/1000;if(l>196)p[i+3]=Math.min(p[i+3],Math.max(0,Math.round((240-l)*255/44)))}x.putImageData(im,0,0)}
  let url=c.toDataURL('image/webp',.88);if(!url.startsWith('data:image/webp'))url=c.toDataURL('image/png');
  if(url.length>280000){const s=document.createElement('canvas');s.width=Math.round(c.width*.7);s.height=Math.round(c.height*.7);s.getContext('2d').drawImage(c,0,0,s.width,s.height);url=s.toDataURL('image/webp',.82);if(!url.startsWith('data:image/webp'))url=s.toDataURL('image/png')}
  if(!LOGO_RX.test(url)||url.length>280000)throw new DataError('الصورة كبيرة؛ صوّر الختم قريباً على خلفية بيضاء');
  return url;
}

// تحميل مكتبتَي ضغط الصور وExcel في الخلفية منذ أول تشغيل (قبل الدخول) وتخزينهما للعمل دون اتصال؛ تُعاد المحاولة عند عودة الشبكة
let prefetchBusy=false,prefetchTries=0;
function prefetchLibs(){
  if(prefetchBusy||navigator.connection?.saveData)return;
  const run=async()=>{
    if(prefetchBusy||!ui.online.peek()||prefetchTries++>=6)return;prefetchBusy=true;
    try{for(const n of ['imgc','xlsx'])await Lib.ensure(n)}catch{}finally{prefetchBusy=false}
    if(['imgc','xlsx'].some(n=>!['cached','loaded'].includes(libState.peek()[n]))&&ui.online.peek())setTimeout(run,60e3);
  };
  const go=()=>setTimeout(run,LITE?4000:1200);
  'requestIdleCallback' in window?requestIdleCallback(go,{timeout:4000}):go();
  addEventListener('online',()=>{prefetchTries=0;setTimeout(run,1500)});
}
// قياس فعلي لسرعة المعالج مرة واحدة (يحفظ النتيجة) لأن مواصفات الجهاز المعلنة قد تكذب
function benchLite(){
  let done=null;try{done=localStorage.getItem('ghiras:liteAuto')}catch{}
  if(done!=null)return;
  const go=()=>{
    const t0=performance.now();let a=[];for(let i=0;i<30000;i++)a.push((i*7919)%10007);a.sort((x,y)=>x-y);JSON.parse(JSON.stringify(a.slice(0,8000)));let z=0;for(let i=0;i<2e6;i++)z+=Math.sqrt(i);
    const ms=performance.now()-t0,weak=ms>170&&z>0;
    try{localStorage.setItem('ghiras:liteAuto',weak?'1':'0')}catch{}
    if(weak&&!root.dataset.lite)root.dataset.lite='1';
  };
  setTimeout(()=>'requestIdleCallback' in window?requestIdleCallback(go,{timeout:6000}):go(),3500);
}

  const out=$('[data-bind=out]',el),sum=$('[data-bind=sum]',el),T=[],t=(name,fn)=>T.push([name,fn]);
  t('تطبيع النص العربي',()=>normalizeAr('أَحْمَدُ إبراهيم')==='احمد ابراهيم');
  t('الساعة المنطقية متزايدة',()=>{const c=createClock('t1'),a=c.now(),b=c.now();return b>a});
  t('ترميز b64u ذهاباً وإياباً',()=>{const x=Sec.rand(33);return b64u.dec(b64u.enc(x)).every((v,i)=>v===x[i])});
  t('تشفير AES-GCM مع بيانات مصاحبة',async()=>{const k=(await Sec.passKeys('pw-test-123',Sec.rand(16),1000)).kek,c=await Sec.encRaw(k,te.encode('مرحبا'),'a'),d=await Sec.decRaw(k,c,'a');let bad=false;try{await Sec.decRaw(k,c,'b')}catch{bad=true}return td.decode(d)==='مرحبا'&&bad});
  t('ضغط gzip ذهاباً وإياباً',async()=>{const x='x'.repeat(5000)+'ي',{blob}=await gzipText(x);return (await readMaybeGz(blob))===x});
  t('رفض نسخة احتياطية مشوّهة',()=>{try{validateBackup({format:'x'});return false}catch{return true}});
  t('سياسة كلمة المرور',()=>{let n=0;for(const p of ['123','abcdefgh'])try{pwPolicy(p)}catch{n++}try{pwPolicy('Str0ng-pass!')}catch{return false}return n===2});
  t('مرآة صلاحيات الرفع',()=>canPush('admin','orphans','x')&&canPush('officer','followups','x')&&!canPush('viewer','followups','x')&&!canPush('officer','donors','x')&&canPush('accountant','donors','x')&&!canPush('officer','settings','org.stamp')&&canPush('admin','settings','org.stamp'));
  t('حقول السجلات الفرعية آمنة وفريدة',()=>{const a=kidField('wallets','a1-b2'),b=kidField('aid','a1-b2');return /^r_[a-z]_[A-Za-z0-9_]+$/.test(a)&&a!==b});
  t('دمج وثيقة قديمة مع v2 بالساعة المنطقية',()=>{
    const old={o:{id:'o1',_hlc:'a1'},w:[],sp:[],aid:[],ln:[],fu:[{id:'f1',orphanId:'o1',_hlc:'a1',note:'قديم'},{id:'f2',orphanId:'o1',_hlc:'a1'}]};
    const d={name:'x/orphans/o1',fields:{d:{stringValue:JSON.stringify(old)},o:{stringValue:JSON.stringify({id:'o1',_hlc:'a5',city:'جديد'})},
      [kidField('followups','f1')]:{stringValue:JSON.stringify({id:'f1',orphanId:'o1',_hlc:'a7',note:'جديد'})},[kidField('followups','f2')]:{stringValue:JSON.stringify({_del:1,s:'followups',id:'f2',_hlc:'a9'})}}};
    const b=Cloud.bundleOf(d,'o1');return b.o.city==='جديد'&&b.fu.length===1&&b.fu[0].note==='جديد'&&b.x.length===1&&b.x[0][1]==='f2'});
  t('فهرس البحث في الـWorker',async()=>{await Work.run('index',{key:'selftest',docs:[{id:1,code:'1',name:'أحمد علي',t:'أحمد علي غزة'},{id:2,code:'2',name:'سارة',t:'سارة رفح'}]});const r=await Work.run('query',{key:'selftest',q:'احمد'});return r.length===1&&r[0]===1});
  t('كشف صيغة الصورة من البايتات',()=>{const f=(...b)=>sniffImage(Uint8Array.from([...b,...Array(32).fill(0)]));return f(0xFF,0xD8,0xFF)==='jpeg'&&f(0x89,0x50,0x4E,0x47)==='png'&&sniffImage(Uint8Array.from([0,0,0,24,...te.encode('ftypheic'),...Array(20).fill(0)]))==='heic'&&f(1,2,3)===''});
  t('سجل التدقيق يُرفع من كل دور كاتب فقط',()=>canPush('officer','audit','x')&&canPush('admin','audit','x')&&!canPush('viewer','audit','x')&&!canPush('orphan','audit','x'));
  t('رقم الهوية: خوارزمية التحقق',()=>nidValid('123456782')&&!nidValid('123456789')&&!nidValid('12345'));
  (async()=>{
    let pass=0;const rows=[];
    for(const[name,fn] of T){let ok=false,err='';try{ok=!!(await fn())}catch(e){err=e.message||String(e)}if(ok)pass++;rows.push(html`<div class="row"><span class="r-t"><b>${name}</b>${err?html`<small>${err}</small>`:''}</span><span class="r-end"><span class="chip ${ok?'ok':'bad'}">${ok?'سليم':'فشل'}</span></span></div>`)}
    out.replaceChildren(toFrag(html`${rows}`));sum.textContent=`${nf.format(pass)} من ${nf.format(T.length)} سليمة`;el.dataset.pass=String(pass);el.dataset.total=String(T.length);
  })();
  return el;
};
async function boot(){
  buildShell();
  addEventListener('hashchange',onHash);
  if(history.state&&typeof history.state.i==='number')histIdx=history.state.i;else{try{history.replaceState({i:histIdx},'')}catch{}}
  setupPWA();
  const hide=()=>{const s=$('#splash');if(!s||s.classList.contains('gone'))return;s.classList.add('gone');setTimeout(()=>s.remove(),700)};
  Promise.race([document.fonts?.ready||Promise.resolve(),new Promise(r=>setTimeout(r,1200))]).then(()=>setTimeout(hide,LITE||reducedMotion.peek()?0:450));
  const last=ui.lastCheck.peek();
  if(ui.online.peek()&&(!last||Date.now()-last>6*3600e3))setTimeout(()=>checkUpdate({silent:true}),2500);
  Gate.show('loading');
  try{await repo.open()}catch(e){Gate.show('error',{msg:dbErrMsg(e)});return}
  navigator.storage?.persist?.().catch(()=>{});
  repo.purgeTrash().catch(()=>{});
  prefetchLibs();benchLite();
  const n=await repo.userCount().catch(()=>0);
  Gate.show(!n&&SETUP?'setup1':'login');
}
boot();
