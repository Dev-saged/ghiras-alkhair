<!doctype html>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; worker-src blob:; img-src blob: data:">
<script src="heic2any.min.js"></script>
<script>
addEventListener('message',async e=>{
  const{id,buf}=e.data||{};if(!(buf instanceof ArrayBuffer))return;
  try{const o=await heic2any({blob:new Blob([buf],{type:'image/heic'}),toType:'image/jpeg',quality:.85});const b=await(Array.isArray(o)?o[0]:o).arrayBuffer();parent.postMessage({id,buf:b},'*',[b])}
  catch(err){parent.postMessage({id,err:String(err&&err.message||err)},'*')}
});
</script>
